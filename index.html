<style>
:root{color-scheme:light;
  --n950:#050b16;--n900:#0a1a33;--n800:#0f2a4f;--n700:#163a6b;--n600:#1f4f8f;--n500:#2c64b0;--n300:#8fb0de;--n100:#dbe6f5;--n50:#eef3fb;
  --page:#f3f6fb;--card:#ffffff;--ink:#0d1b2e;--soft:#34445a;--muted:#5d6e85;--line:#dfe6f0;--mist:#eef2f7;
  --accent:var(--n700);--accent-ink:#ffffff;--slot:var(--n50);--slot-ink:var(--n800);--slot-off:#eef1f5;--slot-off-ink:#a3afbf;
  --hero-a:var(--n950);--hero-b:var(--n700);--hero-ink:#ffffff;--hero-soft:#c5d5ee;--next:var(--n900);
  --ok:#1f8a5b;--ok-50:#e5f5ec;--ok-band:#cdeedd;--bad:#b42318;--bad-50:#fdecec;--tip:#fff8e6;--tip-ink:#8a4b0b;
  --shadow:0 1px 2px rgba(10,26,51,.04),0 6px 18px rgba(10,26,51,.06)}
[data-theme=dark]{color-scheme:dark;
  --page:#000000;--card:#0a1628;--ink:#e9f0fa;--soft:#c3cfdf;--muted:#8d9db3;--line:#1a2b45;--mist:#11213a;
  --accent:var(--n500);--accent-ink:#ffffff;--slot:#10233f;--slot-ink:#cfe0fb;--slot-off:#0d1a2e;--slot-off-ink:#4e6080;
  --hero-a:#000000;--hero-b:var(--n800);--hero-ink:#ffffff;--hero-soft:#9fb7da;--next:#0f2a4f;
  --ok:#4cc38a;--ok-50:#0f2a22;--ok-band:#1d4d38;--bad:#ff7a6e;--bad-50:#3a1414;--tip:#2a2010;--tip-ink:#f2c47d;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.45)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
html.theming *{transition:background-color .45s,color .45s,border-color .45s,box-shadow .45s!important}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;min-height:100vh}
a{color:inherit}.ic{flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* header */
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--hero-a),var(--hero-b),var(--hero-a));background-size:220% 220%;animation:sky 14s ease-in-out infinite;color:var(--hero-ink);padding:22px 20px 20px}
.paws{position:absolute;inset:0;pointer-events:none}.paws i{position:absolute;color:#fff;opacity:.07;top:calc(var(--k) * 19% - 10%);left:calc(var(--k) * 23% + 6%);transform:rotate(calc(var(--k) * 40deg - 30deg));animation:drift calc(9s + var(--k) * 2s) ease-in-out infinite alternate}
.theme{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .2s}
.theme:hover{background:rgba(255,255,255,.2)}.theme:active{transform:rotate(-30deg) scale(.9)}.theme svg{animation:spin-in .5s cubic-bezier(.34,1.56,.64,1)}
.brand{position:relative;display:flex;gap:12px;align-items:center;padding-right:44px}.brand h1{font-size:17px;line-height:1.3;margin:0;font-weight:700;letter-spacing:.01em}.brand p{margin:2px 0 0;font-size:12px;line-height:16px;color:var(--hero-soft)}
.logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none;animation:paw-in .7s cubic-bezier(.34,1.56,.64,1) both}
.quick{position:relative;display:flex;gap:8px;margin-top:14px}.quick a{position:relative;overflow:hidden;flex:1;display:flex;gap:6px;align-items:center;justify-content:center;padding:9px 6px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:13px;font-weight:600;transition:background .15s,transform .15s}
.quick a:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}.quick a:active{transform:scale(.96)}
.quick a:nth-child(1){animation:drop .45s .15s cubic-bezier(.34,1.56,.64,1) both}.quick a:nth-child(2){animation:drop .45s .23s cubic-bezier(.34,1.56,.64,1) both}.quick a:nth-child(3){animation:drop .45s .31s cubic-bezier(.34,1.56,.64,1) both}
/* layout */
.body{padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}.row{display:flex;gap:8px;align-items:center}.right{margin-left:auto;text-align:right}
.muted{color:var(--muted)}.soft{color:var(--soft);margin:0}.small{font-size:12px}.strong{font-weight:600}
.tag{background:var(--n50);color:var(--n700);font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:999px;white-space:nowrap}
[data-theme=dark] .tag{background:#132a4b;color:#bcd2f3}
.patient .muted.right{font-size:12px}.pet{display:flex;gap:12px;align-items:center;margin:10px 0 6px}.pet>div{min-width:0}.pet h2{font-size:22px;line-height:1.2;margin:0;font-weight:700;word-break:break-word}.pet .muted{display:block;font-size:13px}
.badge{width:40px;height:40px;border-radius:50%;background:var(--slot);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;animation:paw-in .7s .25s cubic-bezier(.34,1.56,.64,1) both}
.patient .soft{font-size:13px}.patient hr{border:0;border-top:1px solid var(--line);margin:10px 0}.doctor{margin:0;font-size:13px}
.label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv p{margin:2px 0 0}
.heading{margin-top:4px}.heading h2{font-size:17px;margin:0}.heading .muted{font-size:13px}
.legend{display:flex;gap:8px;align-items:center;margin:0;background:var(--tip);color:var(--tip-ink);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:500}.legend svg{animation:spin 8s linear infinite}
/* medicines */
.meds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.med{display:flex;flex-direction:column;gap:10px;border-radius:14px;padding:14px 16px;overflow:visible}.med::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);transform-origin:top;animation:grow-y .5s .35s cubic-bezier(.2,.8,.2,1) both}
.med .top{align-items:flex-start}.med h3{font-size:16px;line-height:1.35;margin:2px 0 0;font-weight:600;word-break:break-word}.med p{margin:0;font-size:13px}
.no{width:26px;height:26px;border-radius:13px;background:var(--n900);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;animation:spin-in .55s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i,0) * 70ms + 250ms)}
[data-theme=dark] .no{background:var(--n500)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{position:relative;overflow:hidden;background:var(--slot);color:var(--slot-ink);border:0;font:inherit;border-radius:10px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s,box-shadow .25s,transform .08s}
.slot b{font-size:18px;line-height:1.2;color:var(--slot-ink)}.slot span{font-size:11px;font-weight:500}
button.slot{cursor:pointer}button.slot:hover{box-shadow:inset 0 0 0 1px var(--n300)}button.slot:active{transform:scale(.94)}button.slot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.slot.off{background:var(--slot-off);color:var(--slot-off-ink)}.slot.off b,.slot.off span{color:var(--slot-off-ink)}
.slot .tick{position:absolute;top:8px;left:50%;margin-left:-8px;opacity:0;transform:scale(.4) rotate(-20deg);transition:opacity .2s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.slot.given{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 14px rgba(22,58,107,.35)}.slot.given>svg{opacity:0}.slot.given .tick{opacity:1;transform:none}
.slot.given b{color:#fff}.slot.given .w{font-size:0}.slot.given .w::after{content:'Given';font-size:11px;color:#dbe6f5}
.slot .draw{stroke-dasharray:24;stroke-dashoffset:0}.slot.given .draw{animation:draw .4s .05s ease-out both}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips:empty{display:none}.chip{background:var(--mist);color:var(--soft);font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px}.chip.strong{background:var(--n50);color:var(--n800);font-weight:600}
[data-theme=dark] .chip.strong{background:#132a4b;color:#cfe0fb}
.done{margin:0;display:flex;gap:6px;align-items:center;color:var(--ok);font-size:13px;font-weight:600;animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}.done[hidden]{display:none}
.burst{position:absolute;left:50%;top:55%;width:0;height:0;pointer-events:none;z-index:3}.burst i{position:absolute;width:7px;height:7px;border-radius:2px;background:var(--n600);animation:fly .9s cubic-bezier(.2,.8,.2,1) forwards}.burst i:nth-child(3n){background:var(--n300);border-radius:50%}.burst i:nth-child(4n){background:var(--ok)}
/* next visit */
.next{position:relative;display:flex;gap:12px;align-items:center;background:var(--next);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);overflow:hidden}
.next::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.5s 1.2s ease-in-out infinite}
.next div{flex:1;display:flex;flex-direction:column}.next span{font-size:12px;color:var(--hero-soft);font-weight:500}.next b{font-size:16px}
.next>svg{position:relative;transform-origin:50% 0;animation:nod .7s .6s ease-in-out both}
.next>svg::after{content:''}.calring{position:absolute}
.countdown{font-style:normal;align-self:flex-start;margin-top:4px;background:rgba(255,255,255,.14);color:#dbe6f5;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;animation:pop .45s .7s cubic-bezier(.34,1.56,.64,1) both, glow 2.4s 1.4s ease-in-out infinite}
/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;gap:6px;align-items:center;justify-content:center;font:inherit;font-size:14px;font-weight:600;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;transition:transform .15s,background .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{background:var(--n800)}[data-theme=dark] .btn.primary:hover{background:var(--n600)}
.btn.light{background:#fff;color:var(--n900);border:0;padding:8px 12px;font-size:12px;border-radius:10px;z-index:1}.btn.icon{padding:12px}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions .btn:not(.icon){flex:1}#msg{width:100%;font-size:13px;color:var(--accent);animation:pop .3s both}#msg:empty{display:none}
.note,.privacy{font-size:12px;line-height:17px;color:var(--muted);margin:0}.privacy{background:var(--mist);border-radius:12px;padding:12px 14px;color:var(--soft)}
.callout{margin:0;background:var(--mist);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--soft)}.callout.warn{background:var(--bad-50);color:var(--bad);animation:shake .5s .3s both}
.hero-card{color:var(--accent)}.hero-card>svg{animation:float 3s ease-in-out infinite}.hero-card h2{color:var(--ink);font-size:20px;line-height:26px;margin:0}
/* lab */
.counts{display:flex;gap:8px}.count{flex:1;border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}.count b{font-size:22px;font-variant-numeric:tabular-nums}.count span{font-size:12px;font-weight:500}
.count.bad{background:var(--bad-50);color:var(--bad)}.count.good{background:var(--ok-50);color:var(--ok)}
.table{padding:0;overflow:hidden}.table h3{margin:0;padding:12px 16px;background:var(--mist);font-size:14px;border-bottom:1px solid var(--line)}.table ul{list-style:none;margin:0;padding:0}
.result{padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}.result:first-child{border-top:0}
.result .name{flex:1;font-size:14px;font-weight:500}.result .val{font-size:16px}.result .unit{font-size:12px}.result.flagged .val{color:var(--bad)}
.flag{background:var(--bad-50);color:var(--bad);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;animation:pulse 2s 1.4s ease-in-out 3}
.bar{position:relative;height:8px;border-radius:4px;background:var(--mist);margin:3px 0}.bar .ok{position:absolute;top:0;height:8px;border-radius:4px;background:var(--ok-band);transition:width .7s cubic-bezier(.2,.8,.2,1),left .7s cubic-bezier(.2,.8,.2,1)}
.bar .dot{position:absolute;top:-3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--accent);border:2px solid var(--card);box-shadow:0 0 0 1px rgba(0,0,0,.08);transition:left .8s cubic-bezier(.34,1.56,.64,1) .3s,opacity .2s .3s}
.bar .dot.bad{background:var(--bad);animation:ping 1.6s 1.3s ease-out 2}
.bar.pre .ok{width:0!important;transition:none}.bar.pre .dot{left:0!important;opacity:0;transition:none}
.print-only{display:none}.sign{margin:48px 0 0 auto;width:240px;text-align:center;font-size:13px}.sign .line{border-top:1px solid currentColor;margin-bottom:6px}
/* motion */
@keyframes sky{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes drift{from{transform:translate(0,0) rotate(-20deg)}to{transform:translate(14px,-10px) rotate(10deg)}}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-10px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes paw-in{0%{opacity:0;transform:scale(.4) rotate(-25deg)}100%{opacity:1;transform:none}}
@keyframes spin-in{from{opacity:0;transform:rotate(-180deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes grow-y{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.6) rotate(220deg)}}
@keyframes nod{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-4deg)}}
@keyframes sheen{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(143,176,222,0)}50%{box-shadow:0 0 0 4px rgba(143,176,222,.18)}}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.12)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(180,35,24,.45)}100%{box-shadow:0 0 0 10px rgba(180,35,24,0)}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hero .brand{animation:fade .4s both}
.reveal{opacity:0;transform:translateY(28px) scale(.98)}.reveal.in{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.body>.reveal.in:nth-child(2){animation-delay:.07s}.body>.reveal.in:nth-child(3){animation-delay:.14s}.body>.reveal.in:nth-child(4){animation-delay:.21s}
.meds>.med.reveal.in{animation-delay:calc(var(--i,0) * 40ms)}
.slots .slot{animation:pop .4s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i,0) * 70ms + 300ms)}.slots .slot:nth-child(2){animation-delay:calc(var(--i,0) * 70ms + 360ms)}.slots .slot:nth-child(3){animation-delay:calc(var(--i,0) * 70ms + 420ms)}
.reveal:not(.in) .slot,.reveal:not(.in) .no,.med.reveal:not(.in)::before,.reveal:not(.in) .badge{animation:none}
.slots .slot.bump{animation:bump .4s cubic-bezier(.34,1.56,.64,1);animation-delay:0s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}.paws{display:none}}
@media (min-width:600px){#app{padding:24px 0}.hero{border-radius:20px 20px 0 0}}
@media print{body *{display:none!important}body::after{content:'Printing is not available for this page. Please ask M.K. Pet Clinic and Diagnostics for a printed copy.';display:block;padding:40px;font:16px/1.5 sans-serif;color:#000}}
